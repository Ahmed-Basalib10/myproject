name: Update prices

on:
  # NO schedule: trigger here, deliberately. GitHub's own scheduler was
  # tested (via the Actions run history) and found to fire this workflow
  # roughly every 6-7 hours, not every 15 minutes as configured — GitHub
  # throttles schedule-triggered runs for accounts without much history, and
  # there's no YAML fix for that. Timing is instead driven externally by a
  # Cloudflare Worker with a Cron Trigger (see price-cron-trigger/) that
  # calls this workflow's dispatches API endpoint every 15 minutes. Don't
  # add a schedule: block back without re-verifying it actually fires on
  # time — it looked "active" and correct last time too, right up until the
  # run history showed it wasn't.
  workflow_dispatch: {}

# Public repo => unlimited free Actions minutes, and no separate "build"
# system to rate-limit against (GitHub Pages just serves whatever's
# committed here, no CI build step of its own).
permissions:
  contents: write

# Runs queue instead of overlapping, in case one run ever takes longer than
# the schedule interval.
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch prices and regenerate site
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          USD_SAR_RATE: '3.75'
          SITE_URL: 'https://dhahabksa.com'
        run: node scripts/update-prices.js

      - name: Commit and push if prices changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json index.html silver.html sitemap.xml
          git diff --staged --quiet || git commit -m "chore: update gold/silver prices [skip ci]"
          git push
